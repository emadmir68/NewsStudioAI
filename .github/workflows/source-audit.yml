name: Test and build Windows release v0.3.0
on:
  push:
    branches: [main]
    paths:
      - 'NewsStudioAI_v0.3.0_Windows_Source.tar.xz'
      - 'scripts/prepare_v021.py'
      - '.github/workflows/source-audit.yml'
      - 'NewsStudioAI_v02/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: newsstudioai-v0.3.0-release
  cancel-in-progress: true
jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate committed source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f NewsStudioAI_v02/app.py
          test -f NewsStudioAI_v02/animation_dubbing.py
          test -f NewsStudioAI_v02/static/animation.js
          find NewsStudioAI_v02 -type f -not -path '*/.pytest_cache/*' -printf '%P\t%s bytes\n' | sort | tee source-inventory.txt
      - name: Install test dependencies
        working-directory: NewsStudioAI_v02
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run source checks and integration tests
        working-directory: NewsStudioAI_v02
        run: |
          python -m compileall -q app.py launcher.py animation_dubbing.py tests
          node --check static/app.js
          node --check static/animation.js
          python -m pytest -q
      - name: Remove test caches and local database
        shell: bash
        run: |
          find NewsStudioAI_v02 -type d \( -name '__pycache__' -o -name '.pytest_cache' \) -prune -exec rm -rf {} +
          find NewsStudioAI_v02 -type f -name '*.pyc' -delete
          rm -f NewsStudioAI_v02/workspace/auth.sqlite3*
          find NewsStudioAI_v02/workspace/projects NewsStudioAI_v02/workspace/users -type f ! -name '.gitkeep' -delete 2>/dev/null || true
      - name: Create updated source archive
        shell: bash
        run: |
          tar --exclude='*/.venv' --exclude='*/__pycache__' --exclude='*/.pytest_cache' --exclude='*.pyc' --exclude='*/workspace/auth.sqlite3*' --exclude='*/build' --exclude='*/dist' --exclude='*/installer-output' --exclude='*/vendor/ffmpeg' -cJf NewsStudioAI_v0.3.0_Windows_Source.tar.xz NewsStudioAI_v02
          xz -t NewsStudioAI_v0.3.0_Windows_Source.tar.xz
          sha256sum NewsStudioAI_v0.3.0_Windows_Source.tar.xz
      - name: Upload tested source package
        uses: actions/upload-artifact@v4
        with:
          name: newsstudioai-source-package
          path: |
            NewsStudioAI_v02/
            NewsStudioAI_v0.3.0_Windows_Source.tar.xz
            source-inventory.txt
          if-no-files-found: error
          retention-days: 14
  build-windows:
    needs: source-audit
    runs-on: windows-latest
    steps:
      - name: Download tested source package
        uses: actions/download-artifact@v4
        with:
          name: newsstudioai-source-package
          path: .
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and bundle FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg-essentials.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-essentials'
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem -Path $extract -Filter 'ffmpeg.exe' -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $extract -Filter 'ffprobe.exe' -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'FFmpeg or ffprobe executable was not found in the downloaded package.' }
          $bin = Join-Path $env:GITHUB_WORKSPACE 'NewsStudioAI_v02\vendor\ffmpeg\bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Copy-Item $ffmpeg.FullName (Join-Path $bin 'ffmpeg.exe') -Force
          Copy-Item $ffprobe.FullName (Join-Path $bin 'ffprobe.exe') -Force
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          Write-Host "Bundled FFmpeg from $($ffmpeg.FullName)"
      - name: Install dependencies and run Windows tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'NewsStudioAI_v02')
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-ai.txt -r requirements-desktop.txt -r requirements-dev.txt pyinstaller
          python -m compileall -q app.py launcher.py tests
          node --check static/app.js
          python -m pytest -q
      - name: Build Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'NewsStudioAI_v02')
          python -m PyInstaller --noconfirm --clean NewsStudioAI.spec
          if (-not (Test-Path 'dist\NewsStudioAI\NewsStudioAI.exe')) { throw 'PyInstaller did not produce NewsStudioAI.exe' }
          $bundledFfmpeg = Get-ChildItem -Path 'dist\NewsStudioAI' -Filter 'ffmpeg.exe' -Recurse | Select-Object -First 1
          $bundledFfprobe = Get-ChildItem -Path 'dist\NewsStudioAI' -Filter 'ffprobe.exe' -Recurse | Select-Object -First 1
          if (-not $bundledFfmpeg) { throw 'Bundled ffmpeg.exe is missing from the application output.' }
          if (-not $bundledFfprobe) { throw 'Bundled ffprobe.exe is missing from the application output.' }
      - name: Build standalone single-file EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'NewsStudioAI_v02')
          python -m PyInstaller --noconfirm --clean NewsStudioAI_OneFile.spec
          if (-not (Test-Path 'dist\NewsStudioAI.exe')) { throw 'PyInstaller did not produce the standalone NewsStudioAI.exe' }
      - name: Smoke test standalone single-file EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'NewsStudioAI_v02')
          $exe = Join-Path (Get-Location) 'dist\NewsStudioAI.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--server-only' -PassThru -WindowStyle Hidden
          try {
            $health = $null
            for ($i = 0; $i -lt 90; $i++) {
              $process.Refresh()
              if ($process.HasExited) { throw 'Standalone NewsStudioAI.exe exited before its API became ready.' }
              try { $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/health' -TimeoutSec 2; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $health) { throw 'Standalone NewsStudioAI.exe did not start its local API within 90 seconds.' }
            if (-not $health.ffmpeg -or -not $health.ffprobe) { throw 'Standalone EXE cannot locate its embedded FFmpeg tools.' }
            Write-Host "Standalone single-file EXE smoke test passed. Version: $($health.version)"
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Smoke test packaged Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'NewsStudioAI_v02')
          $ffmpeg = Get-ChildItem -Path 'dist\NewsStudioAI' -Filter 'ffmpeg.exe' -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path 'dist\NewsStudioAI' -Filter 'ffprobe.exe' -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'Bundled FFmpeg tools are missing.' }
          $ffmpegVersion = & $ffmpeg.FullName -version 2>&1
          $ffmpegExitCode = $LASTEXITCODE
          if ($ffmpegExitCode -ne 0) { throw "Bundled ffmpeg.exe failed to execute: $ffmpegExitCode" }
          Write-Host ($ffmpegVersion | Select-Object -First 1)
          $ffprobeVersion = & $ffprobe.FullName -version 2>&1
          $ffprobeExitCode = $LASTEXITCODE
          if ($ffprobeExitCode -ne 0) { throw "Bundled ffprobe.exe failed to execute: $ffprobeExitCode" }
          Write-Host ($ffprobeVersion | Select-Object -First 1)
          $process = Start-Process -FilePath (Join-Path (Get-Location) 'dist\NewsStudioAI\NewsStudioAI.exe') -ArgumentList '--server-only' -PassThru -WindowStyle Hidden
          try {
            $health = $null
            for ($i = 0; $i -lt 30; $i++) {
              $process.Refresh()
              if ($process.HasExited) { throw 'Packaged NewsStudioAI.exe exited before its API became ready.' }
              try { $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/health' -TimeoutSec 2; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $health) { throw 'Packaged NewsStudioAI.exe did not start its local API.' }
            if (-not $health.ffmpeg -or -not $health.ffprobe) { throw 'Packaged application cannot locate bundled FFmpeg tools.' }
            Write-Host "Packaged application health check passed. Version: $($health.version)"
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --yes --no-progress
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'NewsStudioAI_v02')
          $compiler = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler was not found after installation.' }
          & $compiler 'installer\NewsStudioAI.iss'
          if (-not (Test-Path 'installer-output\NewsStudioAI_Setup_0.3.0.exe')) { throw 'Inno Setup did not produce the installer.' }
      - name: Prepare release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'NewsStudioAI_v02')
          $release = Join-Path $env:GITHUB_WORKSPACE 'release_output'
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          Copy-Item 'installer-output\NewsStudioAI_Setup_0.3.0.exe' $release
          Copy-Item 'dist\NewsStudioAI.exe' (Join-Path $release 'NewsStudioAI_0.3.0.exe')
          Compress-Archive -Path 'dist\NewsStudioAI\*' -DestinationPath (Join-Path $release 'NewsStudioAI_Portable_0.3.0.zip') -CompressionLevel Optimal
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'NewsStudioAI_v0.3.0_Windows_Source.tar.xz') $release
          Get-ChildItem $release -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | Set-Content (Join-Path $release 'SHA256SUMS.txt')
      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: newsstudioai-windows-release
          path: release_output/*
          if-no-files-found: error
          retention-days: 30
  publish-release:
    needs: build-windows
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows release files
        uses: actions/download-artifact@v4
        with:
          name: newsstudioai-windows-release
          path: release_files
      - name: Publish public GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          target_commitish: main
          name: News Studio AI v0.3.0
          generate_release_notes: true
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            نسخه 0.3.0 استودیوی تدوین خبر با رابط فارسی و دوبله هوشمند انیمیشن.
            
            - نصب‌کننده Windows x64 با FFmpeg و ffprobe همراه
            - نسخه Portable
            - بسته کامل سورس
            - تحلیل محلی انیمیشن، تولید فیلمنامه فارسی، صداسازی شخصیت‌ها و میکس دوبله
            - آزمون‌های API، نقش‌ها، تشخیص سکوت، زیرنویس و رندر سه نسبت تصویر
          files: |
            release_files/NewsStudioAI_Setup_0.2.1.exe
            release_files/NewsStudioAI_0.2.1.exe
            release_files/NewsStudioAI_Portable_0.2.1.zip
            release_files/NewsStudioAI_v0.3.0_Windows_Source.tar.xz
            release_files/SHA256SUMS.txt